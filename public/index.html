<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shanvi Hospitality CRM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    .logo-container {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #f97316 0%, #d97706 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      color: white;
      box-shadow: 0 20px 25px -5px rgba(249, 115, 22, 0.3);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    SH
  </div>
  <h1>Shanvi Hospitality</h1>
  <p>Connecting to CRM workspace...</p>
  <div class="spinner"></div>
  <div class="status" id="status-text">INITIALIZING</div>

  <script>
    // In Capacitor, if hosted server.url is configured in capacitor.config.ts,
    // Capacitor automatically opens that URL. If falling back to index.html:
    const targetUrl = window.localStorage.getItem('crm_server_url') || 'https://shanvihospitality-crm.vercel.app';
    setTimeout(() => {
      if (window.location.href.indexOf(targetUrl) === -1) {
        document.getElementById('status-text').textContent = 'REDIRECTING';
        window.location.href = targetUrl;
      }
    }, 1200);
  </script>
</body>
</html>
