name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:dummy@localhost:5432/postgres"
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          CI: "false"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias shanvicrm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass shanvicrm123 -keypass shanvicrm123 \
            -dname "CN=Shanvi Hospitality, OU=CRM, O=Shanvi, L=Noida, ST=UP, C=IN"

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Final Release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Shanvi-CRM-v1.0-Release.apk

      - name: Upload Final Release Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shanvi-CRM-v1.0-Final-Release-APK
          path: android/app/build/outputs/apk/release/Shanvi-CRM-v1.0-Release.apk
          retention-days: 30
          if-no-files-found: error
